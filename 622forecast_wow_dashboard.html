<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Forecast Movement — New Logo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fafaf8;--bg2:#f0efec;--bg3:#e5e4e0;--card:#fff;--tx:#1a1a1a;--tx2:#6b6b6b;--tx3:#999;--bd:#e0e0de;--grn:#1D9E75;--grn2:#e8f5ef;--amb:#BA7517;--amb2:#fdf3e0;--red:#E24B4A;--red2:#fce8e8;--blu:#3B6FD4;--blu2:#e8eefc;--pur:#534AB7;--pur2:#eeeafc;--shadow:0 1px 3px rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#141414;--bg2:#1e1e1e;--bg3:#2a2a2a;--card:#1e1e1e;--tx:#e0e0e0;--tx2:#888;--tx3:#555;--bd:#333;--grn2:#0f2a1f;--amb2:#2a1f0a;--red2:#2a1010;--blu2:#0f1a2a;--pur2:#1a152a;--shadow:0 1px 3px rgba(0,0,0,.3)}}
body{font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--tx);padding:20px 24px;font-size:14px;line-height:1.5;max-width:1200px;margin:0 auto}
h1{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-bottom:4px}
.sub{font-size:12px;color:var(--tx3);margin-bottom:20px;line-height:1.6}
.tabs{display:flex;gap:6px;margin-bottom:24px;flex-wrap:wrap}
.tab{padding:5px 14px;font-size:12px;font-weight:500;border-radius:6px;cursor:pointer;border:1px solid var(--bd);background:transparent;color:var(--tx2);transition:all .15s;font-family:inherit}
.tab:hover{background:var(--bg2)}
.tab.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.sec{margin-bottom:28px}
.sh{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--tx2);margin-bottom:10px}
.desc{font-size:11px;color:var(--tx3);margin-bottom:10px}

/* Stacked area chart */
.chart-wrap{position:relative;height:280px;background:var(--card);border-radius:10px;border:1px solid var(--bd);padding:16px 16px 32px 56px;margin-bottom:8px;box-shadow:var(--shadow)}
.chart-wrap canvas{width:100%!important;height:100%!important}
.chart-legend{display:flex;gap:14px;font-size:11px;color:var(--tx2);margin-bottom:16px;flex-wrap:wrap}
.chart-legend span{display:flex;align-items:center;gap:4px}
.chart-legend i{width:10px;height:10px;border-radius:2px;display:inline-block}

/* Metric cards */
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.mc{background:var(--card);border-radius:8px;padding:12px 14px;border:1px solid var(--bd);box-shadow:var(--shadow)}
.ml{font-size:10px;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:3px}
.mv{font-size:22px;font-weight:700;letter-spacing:-.02em}
.ms{font-size:10px;color:var(--tx3);margin-top:2px;line-height:1.4}
.delta{font-size:10px;font-weight:600;padding:1px 5px;border-radius:4px;display:inline-block;margin-top:3px}
.delta.up{background:var(--grn2);color:var(--grn)}
.delta.down{background:var(--red2);color:var(--red)}

/* Tables */
table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px}
th{text-align:left;padding:6px;font-weight:600;color:var(--tx3);font-size:10px;border-bottom:1px solid var(--bd);text-transform:uppercase;letter-spacing:.04em}
th.r{text-align:right}th.c{text-align:center}
td{padding:6px;border-bottom:1px solid var(--bd);color:var(--tx)}
td.r{text-align:right;font-variant-numeric:tabular-nums}
td.c{text-align:center}
td.b{font-weight:600}
.tbl-wrap{background:var(--card);border-radius:8px;border:1px solid var(--bd);padding:12px;box-shadow:var(--shadow);overflow-x:auto}

/* FC movement badges */
.fc-badge{font-size:10px;font-weight:500;padding:2px 7px;border-radius:4px;display:inline-block;white-space:nowrap}
.fc-commit{background:var(--grn2);color:var(--grn)}
.fc-best{background:var(--blu2);color:var(--blu)}
.fc-pipe{background:var(--amb2);color:var(--amb)}
.fc-early{background:var(--bg2);color:var(--tx3)}
.arrow-up{color:var(--grn);font-weight:700}
.arrow-down{color:var(--red);font-weight:700}

/* Rep cards */
.rep-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px;margin-bottom:16px}
.rep-card{background:var(--card);border-radius:8px;border:1px solid var(--bd);padding:14px;box-shadow:var(--shadow)}
.rep-name{font-size:13px;font-weight:700;margin-bottom:6px}
.rep-bar{height:22px;background:var(--bg2);border-radius:4px;display:flex;overflow:hidden;margin-bottom:6px}
.rep-bar div{height:100%;transition:width .3s}
.rep-meta{font-size:10px;color:var(--tx3);display:flex;gap:10px;flex-wrap:wrap}
.rep-meta span{display:flex;align-items:center;gap:3px}

/* Volatile deal path */
.path{display:flex;align-items:center;gap:3px;flex-wrap:wrap;font-size:10px}
.path-node{padding:1px 6px;border-radius:3px;font-weight:500}

.sep{height:1px;background:var(--bd);margin:20px 0}
@media(max-width:700px){.g4{grid-template-columns:repeat(2,1fr)}.g5{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}.rep-grid{grid-template-columns:1fr}body{padding:12px}}
</style>
</head>

const fmt=v=>{if(v==null||isNaN(v))return'$0';if(v>=1e6)return'$'+(v/1e6).toFixed(2)+'M';if(v>=1e3)return'$'+Math.round(v/1e3)+'K';return'$'+Math.round(v)};

const pct=(a,b)=>b>0?Math.round(a/b*100):0;

const fcBg=fc=>{const m={'Commit':'var(--grn2)','Best Case':'var(--blu2)','Pipeline':'var(--amb2)','Early Stage':'var(--bg2)'};return m[fc]||'var(--bg2)'};

let view='team';
let selRep=null;

// Filter reps to those with meaningful data (>3 snapshots and >$50K at some point)
const mainReps=DATA.reps.filter(r=>{
  const d=DATA.rep_weekly[r];
  if(!d||d.length<3)return false;
  return d.some(w=>w.call_acv>0||w.total_acv>100000);
});

function init(){
  document.getElementById('dateRange').textContent=DATA.dates[0]+' → '+DATA.dates[DATA.dates.length-1]+' ('+DATA.dates.length+' snapshots)';
  renderTabs();
  render();
}

function renderTabs(){
  let h='<button class="tab'+(view==='team'?' on':'')+'" onclick="view=\'team\';selRep=null;renderTabs();render()">Team Overview</button>';
  h+='<button class="tab'+(view==='wow'?' on':'')+'" onclick="view=\'wow\';selRep=null;renderTabs();render()">WoW Changes</button>';
  h+='<button class="tab'+(view==='reps'?' on':'')+'" onclick="view=\'reps\';selRep=null;renderTabs();render()">By Rep</button>';
  h+='<button class="tab'+(view==='volatile'?' on':'')+'" onclick="view=\'volatile\';selRep=null;renderTabs();render()">Volatile Deals</button>';
  document.getElementById('viewTabs').innerHTML=h;
}

function render(){
  const el=document.getElementById('app');
  if(view==='team')el.innerHTML=renderTeam();
  else if(view==='wow')el.innerHTML=renderWoW();
  else if(view==='reps')el.innerHTML=renderReps();
  else if(view==='volatile')el.innerHTML=renderVolatile();
  if(view==='team'||view==='reps')drawCharts();
}

function renderTeam(){
  const tw=DATA.team_weekly;
  const last=tw[tw.length-1];
  const prev=tw[tw.length-2];
  const callDelta=last.call_acv-prev.call_acv;
  const commitDelta=last.commit_acv-prev.commit_acv;

  let h='';
  // Current snapshot cards
  h+='<div class="sec"><div class="sh">Current snapshot — '+last.label+'</div>';
  h+='<div class="g5">';
  h+=mc('Closed Won',fmt(last.closed_won_acv||0),'var(--grn)',deltaHtml((last.closed_won_acv||0)-(prev.closed_won_acv||0)),(last.closed_won_deals||0)+' deals booked');
  h+=mc('The Call (C+BC)',fmt(last.call_acv),'var(--tx)',deltaHtml(callDelta),last.commit_deals+last.best_case_deals+' deals');
  h+=mc('Commit',fmt(last.commit_acv),'var(--grn)',deltaHtml(commitDelta),last.commit_deals+' deals');
  h+=mc('Best Case',fmt(last.best_case_acv),'var(--blu)',deltaHtml(last.best_case_acv-prev.best_case_acv),last.best_case_deals+' deals');
  h+=mc('Pipeline',fmt(last.pipeline_acv),'var(--amb)',deltaHtml(last.pipeline_acv-prev.pipeline_acv),last.pipeline_deals+' deals');
  h+='</div></div>';

  // Closed won burndown + pipeline remaining
  h+='<div class="sec"><div class="sh">Q2 closed won burndown</div>';
  h+='<div class="desc">Cumulative closed won ACV vs remaining open pipeline by week. Starts at Q2 (April). Closed lost shown for context.</div>';
  h+='<div class="chart-legend">';
  h+='<span><i style="background:var(--grn)"></i>Closed Won</span>';
  h+='<span><i style="background:var(--tx);opacity:.3"></i>Open Pipeline</span>';
  h+='<span style="color:var(--tx3)"><i style="background:var(--red);opacity:.4"></i>Closed Lost</span>';
  h+='</div>';
  h+='<div class="chart-wrap" style="height:320px;padding:20px 24px 44px 70px"><canvas id="burndownChart"></canvas></div>';
  if(DATA.closed_won_deals&&DATA.closed_won_deals.length>0){
    h+='<div class="sh" style="margin-top:12px">Closed won deals — Q2 2026 ('+DATA.closed_won_deals.length+' deals, '+fmt(DATA.closed_won_deals.reduce((a,d)=>a+d.acv,0))+')</div>';
    h+='<div class="tbl-wrap"><table><thead><tr><th>Deal</th><th>Rep</th><th class="r">ACV</th><th>Close date</th></tr></thead><tbody>';
    DATA.closed_won_deals.forEach(d=>{
      h+='<tr><td class="b" style="max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+d.name+'</td>';
      h+='<td style="color:var(--tx2);white-space:nowrap">'+d.owner+'</td>';
      h+='<td class="r" style="color:var(--grn)">'+fmt(d.acv)+'</td>';
      h+='<td style="color:var(--tx3)">'+d.close_date+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='</div>';

  // Stacked area chart
  h+='<div class="sec"><div class="sh">Forecast call evolution (Commit + Best Case ACV)</div>';
  h+='<div class="chart-legend">';
  h+='<span><i style="background:var(--grn)"></i>Commit</span>';
  h+='<span><i style="background:var(--blu)"></i>Best Case</span>';
  h+='<span><i style="background:var(--amb)"></i>Pipeline</span>';
  h+='<span style="color:var(--tx3)"><i style="background:var(--bg3)"></i>Early Stage</span>';
  h+='</div>';
  h+='<div class="chart-wrap"><canvas id="teamChart"></canvas></div>';
  h+='</div>';

  // Transition summary
  h+='<div class="sec"><div class="sh">Movement summary (all weeks combined)</div>';
  h+='<div class="desc">Total FC changes across '+DATA.wow_changes.length+' weekly transitions. Upgrades = moved to a higher FC bucket. Downgrades = moved lower.</div>';
  const totalUp=DATA.transitions.filter(t=>['Early Stage → Pipeline','Pipeline → Best Case','Best Case → Commit','Early Stage → Best Case','Pipeline → Commit'].includes(t.label)).reduce((a,t)=>a+t.count,0);
  const totalDown=DATA.transitions.filter(t=>['Best Case → Pipeline','Commit → Best Case','Pipeline → Early Stage'].includes(t.label)).reduce((a,t)=>a+t.count,0);
  h+='<div class="g3">';
  h+=mc('Upgrades',totalUp+' moves','var(--grn)','','Deals progressed forward');
  h+=mc('Downgrades',totalDown+' moves','var(--red)','','Deals slipped back');
  h+=mc('Ratio',Math.round(totalUp/Math.max(totalDown,1))+'x upgrade','var(--tx)','',totalUp+' up / '+totalDown+' down');
  h+='</div>';
  h+='<div class="tbl-wrap"><table><thead><tr><th>Transition</th><th class="r">Count</th><th class="r">ACV involved</th><th>Direction</th></tr></thead><tbody>';
  DATA.transitions.forEach(t=>{
    const up=['Early Stage → Pipeline','Pipeline → Best Case','Best Case → Commit','Early Stage → Best Case','Pipeline → Commit'].includes(t.label);
    h+='<tr><td class="b">'+t.label+'</td><td class="r">'+t.count+'</td><td class="r">'+fmt(t.acv)+'</td><td><span class="'+(up?'arrow-up':'arrow-down')+'">'+(up?'▲':'▼')+'</span></td></tr>';
  });
  h+='</tbody></table></div></div>';

  return h;
}

function renderWoW(){
  let h='<div class="sec"><div class="sh">Week-over-week FC changes</div>';
  h+='<div class="desc">Every deal where Forecast_Category_editable__c changed between consecutive Monday snapshots. Ordered newest first.</div></div>';

  const weeks=[...DATA.wow_changes].reverse();
  weeks.forEach(w=>{
    h+='<div class="sec">';
    h+='<div class="sh" style="display:flex;justify-content:space-between;align-items:center">';
    h+='<span>'+w.from_date+' → '+w.to_date+'</span>';
    h+='<span style="font-weight:400;text-transform:none;letter-spacing:0">'+w.changes.length+' FC changes · <span class="arrow-up">▲'+w.upgrades+'</span> · <span class="arrow-down">▼'+w.downgrades+'</span> · +'+w.new_count+' new · −'+w.dropped_count+' dropped</span>';
    h+='</div>';
    if(w.changes.length>0){
      h+='<div class="tbl-wrap"><table><thead><tr><th>Deal</th><th>Rep</th><th class="c">From</th><th></th><th class="c">To</th><th class="r">ACV</th></tr></thead><tbody>';
      w.changes.sort((a,b)=>b.acv-a.acv).forEach(c=>{
        h+='<tr>';
        h+='<td style="max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+c.deal+'</td>';
        h+='<td style="color:var(--tx2);white-space:nowrap">'+c.owner+'</td>';
        h+='<td class="c"><span class="fc-badge '+fcClass(c.from)+'">'+c.from+'</span></td>';
        h+='<td class="c '+(c.direction==='up'?'arrow-up':'arrow-down')+'">'+(c.direction==='up'?'→':'→')+'</td>';
        h+='<td class="c"><span class="fc-badge '+fcClass(c.to)+'">'+c.to+'</span></td>';
        h+='<td class="r b">'+fmtK(c.acv)+'</td>';
        h+='</tr>';
      });
      h+='</tbody></table></div>';
    }else{
      h+='<div style="color:var(--tx3);font-size:12px;padding:8px 0">No FC changes this week.</div>';
    }
    h+='</div>';
  });
  return h;
}

function renderReps(){
  let h='';

  // Rep selector
  h+='<div class="sec"><div class="sh">Select a rep</div>';
  h+='<div class="tabs" style="margin-bottom:16px">';
  mainReps.forEach(r=>{
    const firstName=r.split(' ')[0];
    h+='<button class="tab'+(selRep===r?' on':'')+'" onclick="selRep=\''+r+'\';render()">'+firstName+'</button>';
  });
  h+='</div></div>';

  if(!selRep){
    // Show all reps as cards
    h+='<div class="sec"><div class="sh">Latest snapshot — all reps</div>';
    h+='<div class="rep-grid">';
    mainReps.forEach(r=>{
      const d=DATA.rep_weekly[r];
      if(!d||d.length===0)return;
      const last=d[d.length-1];
      const total=Math.max(last.total_acv,1);
      h+='<div class="rep-card" onclick="selRep=\''+r+'\';renderTabs();render()" style="cursor:pointer">';
      h+='<div class="rep-name">'+r+' <span style="font-weight:400;color:var(--tx3);font-size:11px">'+last.label+'</span></div>';
      h+='<div class="rep-bar">';
      if(last.commit_acv>0)h+='<div style="width:'+pct(last.commit_acv,total)+'%;background:var(--grn)"></div>';
      if(last.best_case_acv>0)h+='<div style="width:'+pct(last.best_case_acv,total)+'%;background:var(--blu)"></div>';
      if(last.pipeline_acv>0)h+='<div style="width:'+pct(last.pipeline_acv,total)+'%;background:var(--amb)"></div>';
      if(last.early_stage_acv>0)h+='<div style="width:'+pct(last.early_stage_acv,total)+'%;background:var(--bg3)"></div>';
      h+='</div>';
      h+='<div class="rep-meta">';
      h+='<span style="font-weight:600">Call: '+fmt(last.call_acv)+'</span>';
      h+='<span><i style="width:8px;height:8px;border-radius:2px;display:inline-block;background:var(--grn)"></i>'+fmt(last.commit_acv)+'</span>';
      h+='<span><i style="width:8px;height:8px;border-radius:2px;display:inline-block;background:var(--blu)"></i>'+fmt(last.best_case_acv)+'</span>';
      h+='<span><i style="width:8px;height:8px;border-radius:2px;display:inline-block;background:var(--amb)"></i>'+fmt(last.pipeline_acv)+'</span>';
      h+='<span>'+last.total_deals+' deals</span>';
      h+='</div></div>';
    });
    h+='</div></div>';
  }else{
    const d=DATA.rep_weekly[selRep];
    if(!d)return h;
    const last=d[d.length-1];
    h+='<div class="sec"><div class="sh">'+selRep+' — forecast progression</div>';
    h+='<div class="g4">';
    h+=mc('The Call',fmt(last.call_acv),'var(--tx)','',last.commit_deals+last.best_case_deals+' deals');
    h+=mc('Commit',fmt(last.commit_acv),'var(--grn)','',last.commit_deals+' deals');
    h+=mc('Best Case',fmt(last.best_case_acv),'var(--blu)','',last.best_case_deals+' deals');
    h+=mc('Pipeline',fmt(last.pipeline_acv),'var(--amb)','',last.pipeline_deals+' deals');
    h+='</div></div>';

    h+='<div class="sec"><div class="chart-wrap"><canvas id="repChart"></canvas></div></div>';

    h+='<div class="sec"><div class="sh">Weekly detail</div>';
    h+='<div class="tbl-wrap"><table><thead><tr><th>Week</th><th class="r">Commit</th><th class="r">Best Case</th><th class="r">Pipeline</th><th class="r">Early Stage</th><th class="r">Call</th><th class="r">Total</th><th class="r">Deals</th></tr></thead><tbody>';
    d.forEach((w,i)=>{
      const prev=i>0?d[i-1]:null;
      const callD=prev?w.call_acv-prev.call_acv:0;
      h+='<tr>';
      h+='<td class="b">'+w.label+'</td>';
      h+='<td class="r" style="color:var(--grn)">'+fmt(w.commit_acv)+'</td>';
      h+='<td class="r" style="color:var(--blu)">'+fmt(w.best_case_acv)+'</td>';
      h+='<td class="r" style="color:var(--amb)">'+fmt(w.pipeline_acv)+'</td>';
      h+='<td class="r" style="color:var(--tx3)">'+fmt(w.early_stage_acv)+'</td>';
      h+='<td class="r b">'+fmt(w.call_acv)+(callD!==0?' <span class="delta '+(callD>0?'up':'down')+'">'+fmt(callD)+'</span>':'')+'</td>';
      h+='<td class="r">'+fmt(w.total_acv)+'</td>';
      h+='<td class="r">'+w.total_deals+'</td>';
      h+='</tr>';
    });
    h+='</tbody></table></div></div>';
  }
  return h;
}

function renderVolatile(){
  let h='<div class="sec"><div class="sh">Volatile deals — open deals with 2+ FC changes</div>';
  h+='<div class="desc">Open deals that bounced between forecast categories multiple times. Closed deals are excluded. Sorted by number of changes. This signals either legitimate deal progression + setbacks, or inconsistent rep FC discipline.</div></div>';

  h+='<div class="sec"><div class="tbl-wrap"><table><thead><tr><th>Deal</th><th>Rep</th><th class="r">ACV</th><th class="c">Changes</th><th>FC path</th></tr></thead><tbody>';
  DATA.volatile_deals.forEach(d=>{
    h+='<tr>';
    h+='<td class="b" style="max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+d.name+'</td>';
    h+='<td style="color:var(--tx2);white-space:nowrap">'+d.owner+'</td>';
    h+='<td class="r">'+fmt(d.acv)+'</td>';
    h+='<td class="c"><span style="background:'+(d.change_count>=4?'var(--red2)':d.change_count>=3?'var(--amb2)':'var(--bg2)')+';color:'+(d.change_count>=4?'var(--red)':d.change_count>=3?'var(--amb)':'var(--tx2)')+';padding:2px 8px;border-radius:4px;font-weight:600;font-size:11px">'+d.change_count+'</span></td>';
    h+='<td><div class="path">';
    d.path.forEach((p,i)=>{
      if(i>0)h+='<span style="color:var(--tx3)">→</span>';
      h+='<span class="path-node '+fcClass(p.fc)+'">'+p.fc.replace('Early Stage','ES').replace('Best Case','BC').replace('Pipeline','Pipe')+' <span style="opacity:.7">'+p.date+'</span></span>';
    });
    h+='</div></td></tr>';
  });
  h+='</tbody></table></div></div>';

  return h;
}

function mc(label,value,color,deltaStr,sub){
  let h='<div class="mc"><div class="ml">'+label+'</div><div class="mv" style="color:'+color+'">'+value+'</div>';
  if(deltaStr)h+=deltaStr;
  if(sub)h+='<div class="ms">'+sub+'</div>';
  h+='</div>';
  return h;
}

function deltaHtml(v){
  if(!v||Math.abs(v)<500)return'';
  const up=v>0;
  return'<div class="delta '+(up?'up':'down')+'">'+(up?'▲ +':'▼ ')+fmt(Math.abs(v))+' WoW</div>';
}

function drawCharts(){
  if(view==='team'){
    drawStackedArea('teamChart',DATA.team_weekly);
    drawBurndown();
  }else if(view==='reps'&&selRep){
    const d=DATA.rep_weekly[selRep];
    if(d)drawStackedArea('repChart',d);
  }
}

function drawBurndown(){
  const canvas=document.getElementById('burndownChart');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.parentElement.getBoundingClientRect();
  const padL=70,padR=60,padT=16,padB=36;
  const cw=rect.width-padL-padR;
  const ch=rect.height-padT-padB;
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  canvas.style.width=rect.width+'px';
  canvas.style.height=rect.height+'px';
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,rect.width,rect.height);

  // ONLY show Q2 snapshots (April onward)
  const bd=DATA.team_weekly.filter(d=>d.date>='2026-04-01');
  if(bd.length<2)return;

  const maxV=Math.max(...bd.map(d=>(d.closed_won_acv||0)+(d.total_acv||0)),1);
  const yScale=ch/maxV;
  const xStep=cw/(bd.length-1);
  const ox=padL,oy=padT;
  const cs=getComputedStyle(document.documentElement);
  const grn=cs.getPropertyValue('--grn').trim()||'#1D9E75';
  const red=cs.getPropertyValue('--red').trim()||'#E24B4A';
  const txColor=cs.getPropertyValue('--tx').trim()||'#1a1a1a';
  const bdColor2=cs.getPropertyValue('--bd').trim()||'#e0e0de';
  const tx3=cs.getPropertyValue('--tx3').trim()||'#999';

  // Grid lines + Y-axis labels
  ctx.strokeStyle=bdColor2;ctx.lineWidth=0.5;
  for(let i=0;i<=5;i++){
    const yy=oy+ch-ch*(i/5);
    ctx.beginPath();ctx.moveTo(ox,yy);ctx.lineTo(ox+cw,yy);ctx.stroke();
    ctx.fillStyle=tx3;ctx.font='10px -apple-system,sans-serif';ctx.textAlign='right';
    ctx.fillText(fmt(maxV*i/5),ox-8,yy+4);
  }

  // Bars
  const barW=Math.max(Math.min(xStep*0.55,36),10);
  bd.forEach((d,i)=>{
    const x=ox+i*xStep;
    const cwH=(d.closed_won_acv||0)*yScale;
    const opH=(d.total_acv||0)*yScale;
    // Open pipeline stacked on top
    ctx.fillStyle=txColor;ctx.globalAlpha=0.12;
    ctx.fillRect(x-barW/2,oy+ch-cwH-opH,barW,opH);
    ctx.globalAlpha=1;
    // Closed won
    ctx.fillStyle=grn;ctx.globalAlpha=0.85;
    ctx.fillRect(x-barW/2,oy+ch-cwH,barW,cwH);
    ctx.globalAlpha=1;
  });

  // Closed lost line
  ctx.beginPath();ctx.strokeStyle=red;ctx.lineWidth=1.5;ctx.globalAlpha=0.4;
  ctx.setLineDash([4,3]);
  bd.forEach((d,i)=>{
    const x=ox+i*xStep;
    const y=oy+ch-(d.closed_lost_acv||0)*yScale;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;

  // X-axis labels
  ctx.fillStyle=tx3;ctx.font='10px -apple-system,sans-serif';ctx.textAlign='center';
  bd.forEach((d,i)=>{
    ctx.fillText(d.label,ox+i*xStep,oy+ch+20);
  });

  // Label closed won total on last bar
  const lastD=bd[bd.length-1];
  const lastX=ox+(bd.length-1)*xStep;
  const lastCwH=(lastD.closed_won_acv||0)*yScale;
  ctx.fillStyle=grn;ctx.font='bold 10px -apple-system,sans-serif';ctx.textAlign='left';
  ctx.fillText(fmt(lastD.closed_won_acv||0)+' won',lastX+barW/2+6,oy+ch-lastCwH/2+3);
}

function drawStackedArea(canvasId,data){
  const canvas=document.getElementById(canvasId);
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const rect=canvas.parentElement.getBoundingClientRect();
  const w=rect.width-72;
  const h=rect.height-48;
  canvas.width=(w+56)*dpr;
  canvas.height=(h+32)*dpr;
  canvas.style.width=(w+56)+'px';
  canvas.style.height=(h+32)+'px';
  ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w+56,h+32);

  const maxV=Math.max(...data.map(d=>d.commit_acv+d.best_case_acv+d.pipeline_acv+d.early_stage_acv),1);
  const yScale=h/maxV;
  const xStep=data.length>1?w/(data.length-1):w;

  const cs=getComputedStyle(document.documentElement);
  const colors={
    commit:cs.getPropertyValue('--grn').trim()||'#1D9E75',
    best:cs.getPropertyValue('--blu').trim()||'#3B6FD4',
    pipe:cs.getPropertyValue('--amb').trim()||'#BA7517',
    early:cs.getPropertyValue('--bg3').trim()||'#e5e4e0'
  };

  // Build stacked values
  const layers=['early_stage_acv','pipeline_acv','best_case_acv','commit_acv'];
  const layerColors=[colors.early,colors.pipe,colors.best,colors.commit];

  const stacked=data.map(d=>{
    let cum=0;
    return layers.map(l=>{
      const prev=cum;
      cum+=d[l];
      return{y0:prev,y1:cum};
    });
  });

  const ox=40,oy=0;

  // Draw grid lines
  ctx.strokeStyle=cs.getPropertyValue('--bd').trim()||'#e0e0de';
  ctx.lineWidth=0.5;
  const gridSteps=5;
  for(let i=0;i<=gridSteps;i++){
    const yy=oy+h-h*(i/gridSteps);
    ctx.beginPath();ctx.moveTo(ox,yy);ctx.lineTo(ox+w,yy);ctx.stroke();
    ctx.fillStyle=cs.getPropertyValue('--tx3').trim()||'#999';
    ctx.font='9px -apple-system,sans-serif';
    ctx.textAlign='right';
    ctx.fillText(fmt(maxV*i/gridSteps),ox-4,yy+3);
  }

  // Draw areas
  for(let li=0;li<layers.length;li++){
    ctx.beginPath();
    ctx.fillStyle=layerColors[li];
    ctx.globalAlpha=0.7;
    for(let i=0;i<data.length;i++){
      const x=ox+i*xStep;
      const y=oy+h-stacked[i][li].y1*yScale;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    for(let i=data.length-1;i>=0;i--){
      const x=ox+i*xStep;
      const y=oy+h-stacked[i][li].y0*yScale;
      ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha=1;

  // Draw call line (Commit + Best Case)
  ctx.beginPath();
  ctx.strokeStyle=cs.getPropertyValue('--tx').trim()||'#1a1a1a';
  ctx.lineWidth=2;
  ctx.setLineDash([4,3]);
  data.forEach((d,i)=>{
    const x=ox+i*xStep;
    const y=oy+h-(d.commit_acv+d.best_case_acv)*yScale;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.setLineDash([]);

  // X axis labels
  ctx.fillStyle=cs.getPropertyValue('--tx3').trim()||'#999';
  ctx.font='9px -apple-system,sans-serif';
  ctx.textAlign='center';
  data.forEach((d,i)=>{
    if(data.length>10&&i%2!==0&&i!==data.length-1)return;
    const x=ox+i*xStep;
    ctx.fillText(d.label,x,oy+h+14);
  });

  // Label the call line
  const lastD=data[data.length-1];
  const lastX=ox+(data.length-1)*xStep;
  const lastY=oy+h-(lastD.commit_acv+lastD.best_case_acv)*yScale;
  ctx.fillStyle=cs.getPropertyValue('--tx').trim()||'#1a1a1a';
  ctx.font='bold 10px -apple-system,sans-serif';
  ctx.textAlign='left';
  ctx.fillText('Call: '+fmt(lastD.call_acv),lastX-60,lastY-8);
}

init();
</script>
